<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="760" height="360" fill="#F8F9FA"/>

  <!-- Title -->
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1A1A2E">바텀탭 터치타깃 — 현재 vs 권장</text>

  <!-- === LEFT: CURRENT === -->
  <rect x="30" y="55" width="330" height="280" rx="8" fill="#fff" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="195" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#D32F2F">현재 (문제)</text>

  <!-- Phone frame -->
  <rect x="60" y="95" width="270" height="220" rx="12" fill="#1A1A2E"/>
  <!-- Screen -->
  <rect x="68" y="103" width="254" height="196" rx="8" fill="#F0F4F8"/>
  <!-- Content area -->
  <rect x="68" y="103" width="254" height="158" rx="8" fill="#E8EDF2"/>
  <text x="195" y="188" text-anchor="middle" font-size="11" fill="#90A4AE">앱 컨텐츠</text>

  <!-- Bottom nav bar -->
  <rect x="68" y="261" width="254" height="38" rx="0" fill="#FFFFFF"/>
  <line x1="68" y1="261" x2="322" y2="261" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Tab icons (current: 22dp equivalent) -->
  <!-- Home tab -->
  <g transform="translate(100, 272)">
    <rect x="-15" y="-8" width="30" height="22" fill="#EF9A9A" opacity="0.3" rx="2"/>
    <text x="0" y="8" text-anchor="middle" font-size="9" fill="#888">홈</text>
    <!-- 22dp icon representation -->
    <rect x="-9" y="-6" width="18" height="14" rx="2" fill="none" stroke="#E53935" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="28" y="-18" font-size="7" fill="#E53935">22dp</text>
  </g>
  <!-- Map tab -->
  <g transform="translate(145, 272)">
    <rect x="-15" y="-8" width="30" height="22" fill="#EF9A9A" opacity="0.3" rx="2"/>
    <text x="0" y="8" text-anchor="middle" font-size="9" fill="#888">지도</text>
    <rect x="-9" y="-6" width="18" height="14" rx="2" fill="none" stroke="#E53935" stroke-width="1.5" stroke-dasharray="3,2"/>
  </g>
  <!-- Stamp tab -->
  <g transform="translate(195, 272)">
    <rect x="-15" y="-8" width="30" height="22" fill="#EF9A9A" opacity="0.3" rx="2"/>
    <text x="0" y="8" text-anchor="middle" font-size="9" fill="#888">도장</text>
    <rect x="-9" y="-6" width="18" height="14" rx="2" fill="none" stroke="#E53935" stroke-width="1.5" stroke-dasharray="3,2"/>
  </g>
  <!-- Profile tab -->
  <g transform="translate(240, 272)">
    <rect x="-15" y="-8" width="30" height="22" fill="#EF9A9A" opacity="0.3" rx="2"/>
    <text x="0" y="8" text-anchor="middle" font-size="9" fill="#888">내정보</text>
    <rect x="-9" y="-6" width="18" height="14" rx="2" fill="none" stroke="#E53935" stroke-width="1.5" stroke-dasharray="3,2"/>
  </g>

  <!-- Running FAB -->
  <circle cx="195" cy="261" r="16" fill="#006781"/>
  <text x="195" y="265" text-anchor="middle" font-size="12" fill="white">▶</text>

  <!-- Problem callout -->
  <rect x="60" y="305" width="270" height="22" rx="4" fill="#FFEBEE"/>
  <text x="195" y="320" text-anchor="middle" font-size="10" fill="#C62828">아이콘 22dp → 터치영역 부족, 오탭 빈발</text>

  <!-- === RIGHT: RECOMMENDED === -->
  <rect x="400" y="55" width="330" height="280" rx="8" fill="#fff" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="565" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#2E7D32">권장 (Material 3)</text>

  <!-- Phone frame -->
  <rect x="430" y="95" width="270" height="220" rx="12" fill="#1A1A2E"/>
  <!-- Screen -->
  <rect x="438" y="103" width="254" height="196" rx="8" fill="#F0F4F8"/>
  <!-- Content area -->
  <rect x="438" y="103" width="254" height="148" rx="8" fill="#E8EDF2"/>
  <text x="565" y="183" text-anchor="middle" font-size="11" fill="#90A4AE">앱 컨텐츠</text>

  <!-- Bottom nav bar (taller: 56dp) -->
  <rect x="438" y="251" width="254" height="48" rx="0" fill="#FFFFFF"/>
  <line x1="438" y1="251" x2="692" y2="251" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Tab icons (recommended: 48dp touch area) -->
  <!-- Home tab -->
  <g transform="translate(468, 268)">
    <rect x="-22" y="-14" width="44" height="40" fill="#A5D6A7" opacity="0.4" rx="4"/>
    <text x="0" y="-2" text-anchor="middle" font-size="9" fill="#333">홈</text>
    <text x="0" y="14" text-anchor="middle" font-size="7" fill="#888">홈</text>
    <text x="28" y="-20" font-size="7" fill="#2E7D32">48dp</text>
  </g>
  <!-- Map tab -->
  <g transform="translate(518, 268)">
    <rect x="-22" y="-14" width="44" height="40" fill="#A5D6A7" opacity="0.4" rx="4"/>
    <text x="0" y="-2" text-anchor="middle" font-size="9" fill="#333">지도</text>
    <text x="0" y="14" text-anchor="middle" font-size="7" fill="#888">지도</text>
  </g>
  <!-- Stamp tab -->
  <g transform="translate(612, 268)">
    <rect x="-22" y="-14" width="44" height="40" fill="#A5D6A7" opacity="0.4" rx="4"/>
    <text x="0" y="-2" text-anchor="middle" font-size="9" fill="#333">도장</text>
    <text x="0" y="14" text-anchor="middle" font-size="7" fill="#888">도장</text>
  </g>
  <!-- Profile tab -->
  <g transform="translate(662, 268)">
    <rect x="-22" y="-14" width="44" height="40" fill="#A5D6A7" opacity="0.4" rx="4"/>
    <text x="0" y="-2" text-anchor="middle" font-size="9" fill="#333">내정보</text>
    <text x="0" y="14" text-anchor="middle" font-size="7" fill="#888">내정보</text>
  </g>

  <!-- Running FAB -->
  <circle cx="565" cy="251" r="20" fill="#006781"/>
  <text x="565" y="255" text-anchor="middle" font-size="14" fill="white">▶</text>

  <!-- Fix callout -->
  <rect x="430" y="305" width="270" height="22" rx="4" fill="#E8F5E9"/>
  <text x="565" y="320" text-anchor="middle" font-size="10" fill="#1B5E20">minimumInteractiveComponentSize(48.dp) 적용</text>

  <!-- Code snippet -->
  <rect x="60" y="340" width="640" height="15" rx="3" fill="#263238"/>
  <text x="380" y="351" text-anchor="middle" font-size="9" fill="#80CBC4" font-family="monospace">Modifier.minimumInteractiveComponentSize()  // 48dp 보장  |  또는 .size(48.dp) + 아이콘 24.dp</text>
</svg>
