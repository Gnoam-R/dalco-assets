<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="780" height="400" fill="#F8F9FA"/>
  <text x="390" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1A1A2E">딥링크 intent-filter 미구현 — 현재 vs 목표 구조</text>

  <!-- ===== LEFT: CURRENT ===== -->
  <rect x="20" y="50" width="355" height="330" rx="8" fill="#fff" stroke="#E0E0E0" stroke-width="1.5"/>
  <rect x="20" y="50" width="355" height="34" rx="8" fill="#FFEBEE"/>
  <text x="197" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#C62828">현재 — 외부 진입 전혀 불가</text>

  <!-- External sources -->
  <rect x="35" y="100" width="80" height="28" rx="6" fill="#EF9A9A"/>
  <text x="75" y="118" text-anchor="middle" font-size="10" fill="#B71C1C">FCM 알림 CTA</text>
  <rect x="35" y="140" width="80" height="28" rx="6" fill="#EF9A9A"/>
  <text x="75" y="158" text-anchor="middle" font-size="10" fill="#B71C1C">카카오 공유</text>
  <rect x="35" y="180" width="80" height="28" rx="6" fill="#EF9A9A"/>
  <text x="75" y="198" text-anchor="middle" font-size="10" fill="#B71C1C">웹 링크</text>
  <rect x="35" y="220" width="80" height="28" rx="6" fill="#EF9A9A"/>
  <text x="75" y="238" text-anchor="middle" font-size="10" fill="#B71C1C">SNS 공유</text>

  <!-- Blocked arrows -->
  <text x="128" y="119" font-size="16" fill="#E53935">✕</text>
  <text x="128" y="159" font-size="16" fill="#E53935">✕</text>
  <text x="128" y="199" font-size="16" fill="#E53935">✕</text>
  <text x="128" y="239" font-size="16" fill="#E53935">✕</text>

  <!-- Manifest box -->
  <rect x="155" y="90" width="200" height="170" rx="6" fill="#263238"/>
  <text x="255" y="108" text-anchor="middle" font-size="10" fill="#80CBC4" font-family="monospace">AndroidManifest.xml</text>
  <rect x="163" y="114" width="184" height="136" rx="4" fill="#1E272C"/>
  <text x="172" y="130" font-size="8.5" fill="#FF8A65" font-family="monospace">&lt;intent-filter&gt;</text>
  <text x="180" y="144" font-size="8.5" fill="#A5D6A7" font-family="monospace">action MAIN</text>
  <text x="180" y="157" font-size="8.5" fill="#A5D6A7" font-family="monospace">category LAUNCHER</text>
  <text x="172" y="170" font-size="8.5" fill="#FF8A65" font-family="monospace">&lt;/intent-filter&gt;</text>
  <text x="172" y="190" font-size="8.5" fill="#546E7A" font-family="monospace">// 딥링크 없음 ❌</text>
  <text x="172" y="205" font-size="8.5" fill="#546E7A" font-family="monospace">// custom scheme 없음 ❌</text>
  <text x="172" y="220" font-size="8.5" fill="#546E7A" font-family="monospace">// HTTPS App Link 없음 ❌</text>
  <text x="172" y="238" font-size="8.5" fill="#546E7A" font-family="monospace">// VIEW+BROWSABLE 없음 ❌</text>

  <!-- Result -->
  <rect x="35" y="278" width="320" height="32" rx="6" fill="#FFCDD2"/>
  <text x="195" y="299" text-anchor="middle" font-size="11" fill="#B71C1C">외부 소스에서 앱 특정 화면 진입 불가 → 앱 스토어 또는 홈</text>

  <!-- Label -->
  <rect x="35" y="320" width="320" height="40" rx="4" fill="#FFF3E0"/>
  <text x="195" y="337" text-anchor="middle" font-size="9" fill="#E65100">영향: FCM 알림 클릭 → 코스/도장 화면 직접 이동 불가</text>
  <text x="195" y="352" text-anchor="middle" font-size="9" fill="#E65100">공유 링크 클릭 → 앱 열려도 홈 화면만 표시 (공모전 데모 감점)</text>

  <!-- ===== RIGHT: TARGET ===== -->
  <rect x="405" y="50" width="355" height="330" rx="8" fill="#fff" stroke="#E0E0E0" stroke-width="1.5"/>
  <rect x="405" y="50" width="355" height="34" rx="8" fill="#E8F5E9"/>
  <text x="582" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1B5E20">목표 — custom scheme + NavDeepLink</text>

  <!-- External sources -->
  <rect x="420" y="100" width="80" height="28" rx="6" fill="#A5D6A7"/>
  <text x="460" y="118" text-anchor="middle" font-size="10" fill="#1B5E20">FCM 알림 CTA</text>
  <rect x="420" y="140" width="80" height="28" rx="6" fill="#A5D6A7"/>
  <text x="460" y="158" text-anchor="middle" font-size="10" fill="#1B5E20">카카오 공유</text>
  <rect x="420" y="180" width="80" height="28" rx="6" fill="#A5D6A7"/>
  <text x="460" y="198" text-anchor="middle" font-size="10" fill="#1B5E20">웹 링크</text>
  <rect x="420" y="220" width="80" height="28" rx="6" fill="#A5D6A7"/>
  <text x="460" y="238" text-anchor="middle" font-size="10" fill="#1B5E20">SNS 공유</text>

  <!-- Arrows -->
  <line x1="503" y1="114" x2="515" y2="114" stroke="#43A047" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="503" y1="154" x2="515" y2="154" stroke="#43A047" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="503" y1="194" x2="515" y2="194" stroke="#43A047" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="503" y1="234" x2="515" y2="234" stroke="#43A047" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Manifest box -->
  <rect x="516" y="90" width="224" height="180" rx="6" fill="#263238"/>
  <text x="628" y="108" text-anchor="middle" font-size="10" fill="#80CBC4" font-family="monospace">AndroidManifest.xml</text>
  <rect x="524" y="114" width="208" height="146" rx="4" fill="#1E272C"/>
  <text x="532" y="130" font-size="8" fill="#FF8A65" font-family="monospace">&lt;intent-filter&gt;</text>
  <text x="540" y="143" font-size="8" fill="#A5D6A7" font-family="monospace">action VIEW</text>
  <text x="540" y="156" font-size="8" fill="#A5D6A7" font-family="monospace">category DEFAULT</text>
  <text x="540" y="169" font-size="8" fill="#A5D6A7" font-family="monospace">category BROWSABLE</text>
  <text x="540" y="182" font-size="8" fill="#FFE082" font-family="monospace">data scheme="runcourse"</text>
  <text x="532" y="195" font-size="8" fill="#FF8A65" font-family="monospace">&lt;/intent-filter&gt;</text>
  <text x="532" y="210" font-size="8" fill="#80CBC4" font-family="monospace">// NavDeepLink 선언</text>
  <text x="532" y="223" font-size="8" fill="#80CBC4" font-family="monospace">// "runcourse://course/{id}"</text>
  <text x="532" y="236" font-size="8" fill="#80CBC4" font-family="monospace">// "runcourse://stamp/{id}"</text>
  <text x="532" y="249" font-size="8" fill="#80CBC4" font-family="monospace">// "runcourse://notification"</text>

  <!-- NavHost arrow -->
  <line x1="628" y1="270" x2="628" y2="285" stroke="#43A047" stroke-width="2"/>
  <polygon points="628,290 623,280 633,280" fill="#43A047"/>

  <!-- NavHost -->
  <rect x="516" y="290" width="224" height="30" rx="4" fill="#004D40"/>
  <text x="628" y="310" text-anchor="middle" font-size="9" fill="#80CBC4" font-family="monospace">NavHost → 해당 destination</text>

  <!-- Result -->
  <rect x="420" y="330" width="320" height="32" rx="6" fill="#C8E6C9"/>
  <text x="580" y="351" text-anchor="middle" font-size="11" fill="#1B5E20">runcourse://course/123 → CourseDetailScreen ✅</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#43A047"/>
    </marker>
  </defs>
</svg>
