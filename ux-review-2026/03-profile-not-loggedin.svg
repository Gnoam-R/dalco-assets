  <text x="147" y="362" text-anchor="middle" font-size="10" fill="white">▶</text>
  <text x="189" y="368" text-anchor="middle" font-size="7" fill="#90A4AE">도장</text>
  <text x="229" y="368" text-anchor="middle" font-size="7" font-weight="700" fill="#006781">내정보</text>

  <text x="147" y="398" text-anchor="middle" font-size="9" fill="#EF5350">IMPLEMENTATION_GAPS: 12 Profile / Not Logged In ✗</text>

